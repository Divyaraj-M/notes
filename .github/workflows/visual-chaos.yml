name: Visual Chaos Generator

on:
  push:
    paths:
      - 'README.md'
  workflow_dispatch:

jobs:
  visual-chaos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Add visual chaos elements
        run: |
          # Generate ASCII art
          ASCII_ART=(
            "
            🎪 ╔══════════════════════════════════════╗ 🎪
            🎭 ║         CHAOS PROGRESS BAR           ║ 🎭
            🎪 ╚══════════════════════════════════════╝ 🎪
            "
            "
            🧟‍♂️ ████████████████████████████████████████ 🧟‍♂️
            💀 ████████████████████████████████████████ 💀
            👻 ████████████████████████████████████████ 👻
            "
            "
            🎭 ╭──────────────────────────────────────────╮ 🎭
            🎪 │         REALITY CORRUPTION: 85%        │ 🎪
            🎭 ╰──────────────────────────────────────────╯ 🎭
            "
          )
          
          RANDOM_ART=${ASCII_ART[$RANDOM % ${#ASCII_ART[@]}]}
          
          # Create visual section
          VISUAL_SECTION="
          
          ---
          
          ## 🎨 VISUAL CHAOS DISPLAY
          
          $RANDOM_ART
          
          ### 📊 REAL-TIME STATISTICS:
          - 🎪 **Chaos Level:** $(printf '%*s' $((RANDOM % 50 + 50)) | tr ' ' '█') $(($RANDOM % 50 + 50))%
          - 👻 **Ghost Count:** $(printf '%*s' $((RANDOM % 30 + 20)) | tr ' ' '👻') $(($RANDOM % 30 + 20))
          - 💀 **Cursed Files:** $(printf '%*s' $((RANDOM % 15 + 5)) | tr ' ' '💀') $(($RANDOM % 15 + 5))
          - 🧟‍♂️ **Reality Distortion:** $(printf '%*s' $((RANDOM % 40 + 60)) | tr ' ' '🧟‍♂️') $(($RANDOM % 40 + 60))%
          
          ### 🎭 INTERACTIVE ELEMENTS:
          - 🎪 Click [here](https://github.com/${{ github.repository }}/actions) to view chaos in action
          - 👻 Star this repo to add another ghost to the collection
          - 💀 Fork to create a parallel universe
          - 🧟‍♂️ Watch to become part of the chaos
          
          ---
          "
          
          # Add visual section to README
          echo "$VISUAL_SECTION" >> README.md

      - name: Commit visual chaos
        run: |
          git config user.name "VisualChaosBot 🎨"
          git config user.email "visual@chaos.bot"
          git add README.md
          git commit -m "🎨 Visual chaos elements added - Reality becomes more beautiful"
          git push 