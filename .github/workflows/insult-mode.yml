name: Direct Insult Mode

on:
  watch:        # When someone stars the repo
    types: [started]
  fork:         # When someone forks it
  push:         # (Optional) Also when someone pushes to it

jobs:
  insult:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update README with personalized insult
        run: |
          USERNAME="${{ github.actor }}"
          
          # Array of creative insults
          INSULTS=(
            "🎭 **$USERNAME**, the human equivalent of a broken semicolon in production code."
            "🤖 Look who's here — $USERNAME, the personification of a 404 error in humanity."
            "💀 Oh great, $USERNAME showed up. Now the repo smells like Hot Pockets and existential dread."
            "👻 You again, $USERNAME? Didn't you learn last time that curiosity killed the developer?"
            "🧟 $USERNAME, the walking embodiment of 'it works on my machine' syndrome."
            "🎪 $USERNAME, the human equivalent of a stack overflow without accepted answers."
            "💩 $USERNAME, whose code reviews are like a horror movie - everyone dies inside."
            "🎪 $USERNAME, the personification of 'git push --force' in human form."
            "👹 $USERNAME, whose debugging skills are like finding a needle in a haystack... if the needle was also hay."
            "🎭 $USERNAME, the human equivalent of a memory leak that never gets fixed."
          )
          
          # Get random insult
          RANDOM_INSULT=${INSULTS[$RANDOM % ${#INSULTS[@]}]}
          
          # Create timestamp
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
          
          # Create personalized section
          PERSONALIZED_SECTION="
          
          ---
          
          ## 🎯 PERSONALIZED MESSAGE FOR $USERNAME:
          
          **Timestamp:** $TIMESTAMP  
          **Event:** ${{ github.event_name }}  
          **User ID:** ${{ github.actor_id }}
          
          $RANDOM_INSULT
          
          ### 🎪 YOUR CONTRIBUTION TO CHAOS:
          - **Commit Hash:** \`$(echo $USERNAME | md5sum | cut -d' ' -f1)\`
          - **Chaos Level:** $((RANDOM % 100 + 1))/100
          - **Cursed Status:** $(if [ $((RANDOM % 2)) -eq 0 ]; then echo "🔴 ACTIVE"; else echo "🟡 PENDING"; fi)
          
          ### 🎭 SYSTEM LOG ENTRY:
          \`\`\`
          [$TIMESTAMP] User $USERNAME triggered ${{ github.event_name }} event
          [$TIMESTAMP] Insult generated: $(echo "$RANDOM_INSULT" | wc -w) words
          [$TIMESTAMP] Chaos factor increased by $((RANDOM % 25 + 5))%
          [$TIMESTAMP] Repository corruption: $((RANDOM % 15 + 1))% complete
          \`\`\`
          
          ---
          "
          
          # Replace all instances of {{USERNAME}} with actual username
          sed -i "s/{{USERNAME}}/$USERNAME/g" README.md
          
          # Add the new personalized section
          echo "$PERSONALIZED_SECTION" >> README.md

      - name: Commit and push changes
        run: |
          git config user.name "SentientRepoBot 🤖"
          git config user.email "sentient@repo.bot"
          git add README.md
          git commit -m "🎭 Direct Insult to ${{ github.actor }} - Chaos Level Increased"
          git push
