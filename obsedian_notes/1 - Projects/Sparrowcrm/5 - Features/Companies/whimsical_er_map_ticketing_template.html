
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Whimsical ER Map - CRM + Ticketing Template</title>
<style>
  body {
    margin: 0;
    background: #f8fafc;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    color: #0f172a;
  }
  .wrap {
    padding: 24px;
  }
  .title {
    font-size: 28px;
    font-weight: 800;
    margin: 0 0 8px 0;
  }
  .subtitle {
    font-size: 14px;
    color: #475569;
    margin: 0 0 18px 0;
  }
  .legend {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 18px;
    font-size: 13px;
    color: #334155;
  }
  .legend span {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: white;
    border: 1px solid #dbeafe;
    border-radius: 999px;
    padding: 6px 10px;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
  }
  .dot {
    width: 10px; height: 10px; border-radius: 999px; display: inline-block;
  }
  .board {
    background: linear-gradient(180deg, #ffffff, #f8fbff);
    border: 1px solid #dbeafe;
    border-radius: 24px;
    box-shadow: 0 12px 30px rgba(15, 23, 42, 0.06);
    overflow: auto;
    padding: 12px;
  }
  svg {
    width: 1800px;
    height: 1100px;
    display: block;
  }
  .node {
    filter: drop-shadow(0 10px 14px rgba(30,41,59,.08));
  }
  .card {
    fill: #ffffff;
    stroke: #94a3b8;
    stroke-width: 2.2;
    rx: 18;
    ry: 18;
  }
  .accent-company { fill: #eff6ff; }
  .accent-contact { fill: #f5f3ff; }
  .accent-deal { fill: #ecfeff; }
  .accent-meeting { fill: #fff7ed; }
  .accent-ticket { fill: #fef2f2; }
  .accent-support { fill: #f0fdf4; }
  .accent-template { fill: #f8fafc; }
  .node-title {
    font-size: 24px;
    font-weight: 800;
    fill: #0f172a;
  }
  .node-subtitle {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .06em;
    fill: #475569;
  }
  .field {
    font-size: 14px;
    fill: #1e293b;
  }
  .small {
    font-size: 12px;
    fill: #64748b;
  }
  .line {
    fill: none;
    stroke: #64748b;
    stroke-width: 3;
    stroke-linecap: round;
  }
  .line-ticket {
    stroke: #ef4444;
  }
  .line-template {
    stroke: #16a34a;
    stroke-dasharray: 10 8;
  }
  .label {
    font-size: 14px;
    font-weight: 700;
    fill: #0f172a;
  }
  .badge {
    fill: #ffffff;
    stroke: #cbd5e1;
    stroke-width: 1.4;
    rx: 999;
    ry: 999;
  }
  .badge-text {
    font-size: 12px;
    font-weight: 700;
    fill: #334155;
  }
  .footnote {
    font-size: 13px;
    fill: #475569;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="title">Whimsical ER Map — SparrowCRM + Ticketing Integration Template</h1>
  <p class="subtitle">Core CRM entities + normalized ticketing layer + portable provider template for Sparrow Desk, Zendesk, Intercom, Freshdesk, and future connectors.</p>

  <div class="legend">
    <span><i class="dot" style="background:#dbeafe"></i> CRM core object</span>
    <span><i class="dot" style="background:#fee2e2"></i> Ticketing object</span>
    <span><i class="dot" style="background:#dcfce7"></i> Integration template / adapter</span>
    <span><i class="dot" style="background:#ffffff; border:1px solid #94a3b8"></i> Labels show cardinality</span>
  </div>

  <div class="board">
    <svg viewBox="0 0 1800 1100" xmlns="http://www.w3.org/2000/svg">

      <!-- Relationship lines -->
      <path class="line" d="M430 180 C 560 180, 600 260, 600 330" />
      <path class="line" d="M430 180 C 720 160, 760 180, 900 180" />
      <path class="line" d="M415 220 C 545 340, 545 500, 600 620" />
      <path class="line" d="M950 230 C 930 350, 910 480, 900 615" />
      <path class="line" d="M660 660 C 720 720, 820 760, 900 770" />
      <path class="line-ticket" d="M430 180 C 680 120, 1000 120, 1260 180" />
      <path class="line-ticket" d="M640 385 C 860 320, 1080 280, 1260 230" />
      <path class="line-ticket" d="M960 385 C 1120 340, 1200 300, 1260 250" />
      <path class="line-ticket" d="M940 690 C 1100 720, 1190 735, 1260 735" />
      <path class="line-ticket" d="M1460 285 C 1540 340, 1580 410, 1600 480" />
      <path class="line-template" d="M1470 160 C 1570 110, 1650 105, 1710 120" />
      <path class="line-template" d="M1470 180 C 1570 160, 1650 160, 1710 190" />
      <path class="line-template" d="M1470 205 C 1570 220, 1650 235, 1710 265" />
      <path class="line-template" d="M1470 230 C 1570 285, 1650 320, 1710 340" />

      <!-- COMPANY -->
      <g class="node" transform="translate(120,70)">
        <rect class="card accent-company" width="310" height="220"/>
        <text x="24" y="38" class="node-title">Company</text>
        <text x="24" y="61" class="node-subtitle">CORE CRM OBJECT</text>
        <text x="24" y="98" class="field">• Company Name</text>
        <text x="24" y="124" class="field">• Company Domain</text>
        <text x="24" y="150" class="field">• Company Owner</text>
        <text x="24" y="176" class="field">• Linked Contacts</text>
        <text x="24" y="202" class="field">• Linked Deals / Meetings</text>
      </g>

      <!-- CONTACT -->
      <g class="node" transform="translate(445,275)">
        <rect class="card accent-contact" width="310" height="220"/>
        <text x="24" y="38" class="node-title">Contact</text>
        <text x="24" y="61" class="node-subtitle">CORE CRM OBJECT</text>
        <text x="24" y="98" class="field">• First Name / Last Name</text>
        <text x="24" y="124" class="field">• Email</text>
        <text x="24" y="150" class="field">• Company</text>
        <text x="24" y="176" class="field">• Linked Deals</text>
        <text x="24" y="202" class="field">• Linked Meetings</text>
      </g>

      <!-- DEAL -->
      <g class="node" transform="translate(900,70)">
        <rect class="card accent-deal" width="310" height="220"/>
        <text x="24" y="38" class="node-title">Deal</text>
        <text x="24" y="61" class="node-subtitle">CORE CRM OBJECT</text>
        <text x="24" y="98" class="field">• Deal Name</text>
        <text x="24" y="124" class="field">• Deal Value</text>
        <text x="24" y="150" class="field">• Pipeline / Stage</text>
        <text x="24" y="176" class="field">• Company</text>
        <text x="24" y="202" class="field">• Linked Contacts / Meetings</text>
      </g>

      <!-- MEETING -->
      <g class="node" transform="translate(600,615)">
        <rect class="card accent-meeting" width="340" height="220"/>
        <text x="24" y="38" class="node-title">Meeting</text>
        <text x="24" y="61" class="node-subtitle">CORE CRM OBJECT</text>
        <text x="24" y="98" class="field">• Meeting Title</text>
        <text x="24" y="124" class="field">• Start Time / End Time</text>
        <text x="24" y="150" class="field">• Organizer / Attendees</text>
        <text x="24" y="176" class="field">• Company</text>
        <text x="24" y="202" class="field">• Linked Contacts / Deals</text>
      </g>

      <!-- TICKET -->
      <g class="node" transform="translate(1260,120)">
        <rect class="card accent-ticket" width="360" height="280"/>
        <text x="24" y="38" class="node-title">Ticket</text>
        <text x="24" y="61" class="node-subtitle">NORMALIZED SUPPORT OBJECT</text>
        <text x="24" y="98" class="field">• Ticket Subject</text>
        <text x="24" y="124" class="field">• External Ticket ID</text>
        <text x="24" y="150" class="field">• Ticket Provider</text>
        <text x="24" y="176" class="field">• Status / Priority / Type</text>
        <text x="24" y="202" class="field">• Requester / Assigned Agent</text>
        <text x="24" y="228" class="field">• SLA / CSAT / Sentiment</text>
        <text x="24" y="254" class="field">• Company / Contact / Deal links</text>
      </g>

      <!-- TICKET COMMENTS -->
      <g class="node" transform="translate(1425,470)">
        <rect class="card accent-support" width="320" height="180"/>
        <text x="24" y="38" class="node-title">Ticket Comment</text>
        <text x="24" y="61" class="node-subtitle">CHILD OBJECT</text>
        <text x="24" y="98" class="field">• Message body</text>
        <text x="24" y="124" class="field">• Author / Source</text>
        <text x="24" y="150" class="field">• Created At</text>
      </g>

      <!-- PROVIDER TEMPLATE -->
      <g class="node" transform="translate(1200,690)">
        <rect class="card accent-template" width="470" height="260"/>
        <text x="24" y="38" class="node-title">Ticketing Integration Template</text>
        <text x="24" y="61" class="node-subtitle">PORTABLE PROVIDER ADAPTER LAYER</text>
        <text x="24" y="98" class="field">1. Provider connection + auth</text>
        <text x="24" y="124" class="field">2. External → normalized field mapping</text>
        <text x="24" y="150" class="field">3. Status / priority normalization</text>
        <text x="24" y="176" class="field">4. External ID ↔ internal ID bindings</text>
        <text x="24" y="202" class="field">5. Webhooks / sync cursors / retries</text>
        <text x="24" y="228" class="field">6. Reusable for any future helpdesk</text>
      </g>

      <!-- Providers -->
      <g class="node" transform="translate(1710,70)">
        <rect class="card accent-support" width="70" height="70" rx="20" ry="20"/>
        <text x="35" y="42" text-anchor="middle" class="label">Desk</text>
      </g>
      <g class="node" transform="translate(1710,150)">
        <rect class="card accent-support" width="110" height="70" rx="20" ry="20"/>
        <text x="55" y="42" text-anchor="middle" class="label">Zendesk</text>
      </g>
      <g class="node" transform="translate(1710,230)">
        <rect class="card accent-support" width="110" height="70" rx="20" ry="20"/>
        <text x="55" y="42" text-anchor="middle" class="label">Intercom</text>
      </g>
      <g class="node" transform="translate(1710,310)">
        <rect class="card accent-support" width="120" height="70" rx="20" ry="20"/>
        <text x="60" y="42" text-anchor="middle" class="label">Freshdesk</text>
      </g>

      <!-- Cardinality badges -->
      <g transform="translate(470,245)">
        <rect class="badge" width="116" height="30"/>
        <text x="58" y="20" text-anchor="middle" class="badge-text">1 → many</text>
      </g>
      <g transform="translate(640,125)">
        <rect class="badge" width="128" height="30"/>
        <text x="64" y="20" text-anchor="middle" class="badge-text">1 ↔ many</text>
      </g>
      <g transform="translate(450,480)">
        <rect class="badge" width="146" height="30"/>
        <text x="73" y="20" text-anchor="middle" class="badge-text">many ↔ many</text>
      </g>
      <g transform="translate(910,455)">
        <rect class="badge" width="146" height="30"/>
        <text x="73" y="20" text-anchor="middle" class="badge-text">many ↔ many</text>
      </g>
      <g transform="translate(820,740)">
        <rect class="badge" width="116" height="30"/>
        <text x="58" y="20" text-anchor="middle" class="badge-text">1 → many</text>
      </g>

      <g transform="translate(860,95)">
        <rect class="badge" width="128" height="30"/>
        <text x="64" y="20" text-anchor="middle" class="badge-text">1 → many</text>
      </g>
      <g transform="translate(940,250)">
        <rect class="badge" width="128" height="30"/>
        <text x="64" y="20" text-anchor="middle" class="badge-text">1 → many</text>
      </g>
      <g transform="translate(1110,300)">
        <rect class="badge" width="128" height="30"/>
        <text x="64" y="20" text-anchor="middle" class="badge-text">1 → many</text>
      </g>
      <g transform="translate(1070,705)">
        <rect class="badge" width="160" height="30"/>
        <text x="80" y="20" text-anchor="middle" class="badge-text">optional many ↔ many</text>
      </g>
      <g transform="translate(1480,430)">
        <rect class="badge" width="116" height="30"/>
        <text x="58" y="20" text-anchor="middle" class="badge-text">1 → many</text>
      </g>

      <!-- Notes -->
      <g transform="translate(70,930)">
        <rect class="card" width="1650" height="120" style="fill:#ffffff; stroke:#cbd5e1; stroke-width:1.8"/>
        <text x="28" y="35" class="label">Recommended implementation rules</text>
        <text x="28" y="64" class="footnote">• Company → Tickets should be the primary account-level support rollup.</text>
        <text x="28" y="88" class="footnote">• Contact → Ticket is best modeled as 1 → many for the primary requester, with optional many ↔ many participants later.</text>
        <text x="760" y="64" class="footnote">• Deal → Ticket is strongly recommended for renewal risk, onboarding blockers, and escalation visibility.</text>
        <text x="760" y="88" class="footnote">• The CRM should read only the normalized Ticket model; provider-specific logic stays inside the adapter layer.</text>
      </g>

    </svg>
  </div>
</div>
</body>
</html>
